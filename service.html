<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>중간고사</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="media.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <div class="wrap">
      <header>
        <div class="inner">
          <div class="title">
            <h1>서울사이버대학교</h1>
            <p>포털서비스(학생)</p>
          </div>
          <nav aria-label="주요 메뉴">
            <a href="./index.html">학습메뉴</a>
            <a href="./service.html" class="active">고객센터</a>
          </nav>
        </div>
      </header>

      <main>
        <h2>OOO 학우님 안녕하세요.</h2>
        <img src="assets/images/img_campus1.jpg" alt="ai 생성 이미지" />

        <section id="subscribe" class="subscribe-card">
          <h3>고객센터</h3>
          <p>연락처를 남겨주시면 상담원이 확인 후 전화드리겠습니다.</p>
          <form id="consult-form" novalidate>
            <label for="type">상담 유형</label>
            <select id="type" name="type">
              <option value="학적">학적·휴복학</option>
              <option value="수강">수강·출석</option>
              <option value="성적">성적·학점</option>
              <option value="시스템">시스템·로그인</option>
            </select>
            <p id="type-hint" class="hint">학적 상담 · 평일 09:00~18:00</p>

            <label for="tel">연락처</label>
            <input
              type="tel"
              id="tel"
              name="tel"
              inputmode="numeric"
              placeholder="010-1234-5678"
              autocomplete="tel"
              maxlength="13"
              aria-describedby="tel-msg"
            />
            <p id="tel-msg" class="msg" aria-live="polite">
              연락처를 입력해 주세요.
            </p>
            <button type="submit" id="submit-btn" disabled>상담 예약</button>
            <p id="form-status" class="msg" role="status"></p>
          </form>

          <div class="my-list-box">
            <h4>내 상담 예약 내역</h4>
            <div id="list-empty" class="list-empty">
              <p>아직 예약 내역이 없습니다. 위에서 상담을 예약해 보세요.</p>
              <button type="button" id="reservation">상담 예약하러 가기</button>
            </div>
            <ul id="my-list" class="my-list"></ul>
          </div>
        </section>
      </main>

      <footer>
        <div class="inner">
          <small>© 2026 서울사이버대학교</small>
        </div>
      </footer>
    </div>
  </body>
</html>
